name: Publish action
run-name: Publish ${{ inputs.action }} (${{ inputs.version-type }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to publish
        type: choice
        options: [changelog, changelog-cleanup, changelog-release, build-macos]
        required: true
      version-type:
        description: Semantic version increment
        type: choice
        options: [major, minor, patch]
        default: minor
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    with:
      action: ${{ inputs.action }}
      skip-action-smoke-test: true
      upload-release-bundle: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-bits-snapshot-publication
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify bundle reference
        env:
          BUNDLE_ID: ${{ needs.verify.outputs.bundle-id }}
          BUNDLE_SOURCE: ${{ needs.verify.outputs.bundle-source }}
        run: |
          [[ "$BUNDLE_ID" =~ ^[1-9][0-9]*$ && "$BUNDLE_SOURCE" == "$GITHUB_SHA" ]] || {
            echo 'Expected a verified bundle from the release source commit.' >&2
            exit 1
          }
      - name: Download verified Action bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.bundle-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - name: Publish selected action
        env:
          ACTION: ${{ inputs.action }}
          VERSION_TYPE: ${{ inputs.version-type }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BITS_BUNDLE_DIR: ${{ runner.temp }}/release-bundle
          RELEASE_BITS_BUNDLE_SOURCE: ${{ needs.verify.outputs.bundle-source }}
          RELEASE_BITS_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-bits-release-notes.md
        run: |
          set -euo pipefail
          tag="$(node scripts/release.mjs "$ACTION" "$VERSION_TYPE" "$GITHUB_SHA")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes-file "$RELEASE_BITS_RELEASE_NOTES_FILE"
          fi
