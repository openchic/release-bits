name: Test actions

on:
  push:
    branches: [main]
    paths:
      - 'actions/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'actions/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_call:
    inputs:
      action:
        description: Run release verification for one action. Empty runs the full workspace.
        required: false
        type: string
        default: ''
      skip-action-smoke-test:
        description: Skip packaged Action smoke checks when the caller verifies them separately.
        required: false
        type: boolean
        default: false
      upload-release-bundle:
        description: Upload the verified bundle for the selected Action.
        required: false
        type: boolean
        default: false
    outputs:
      bundle-id:
        description: Artifact ID of the verified Action bundle.
        value: ${{ jobs.changelog.outputs.bundle-id || jobs.changelog-cleanup.outputs.bundle-id ||
          jobs.changelog-release.outputs.bundle-id || jobs.macos.outputs.bundle-id }}
      bundle-source:
        description: Commit checked out by the verification job.
        value: ${{ jobs.changelog.outputs.bundle-source || jobs.changelog-cleanup.outputs.bundle-source ||
          jobs.changelog-release.outputs.bundle-source || jobs.macos.outputs.bundle-source }}

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog action
    if: ${{ inputs.action == '' || inputs.action == 'changelog' }}
    runs-on: ubuntu-latest
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      bundle-source: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changelog action types
        run: pnpm --filter @release-bits/changelog check
      - name: Build changelog action
        run: pnpm --filter @release-bits/changelog build
      - name: Verify changelog action tests
        run: pnpm --filter @release-bits/changelog test
      - name: Verify release script
        run: node --test scripts/release.test.mjs
      - name: Verify packaged changelog action
        id: notes
        if: ${{ !inputs.skip-action-smoke-test }}
        uses: ./actions/changelog
        with:
          version: 1.2.3
        env:
          GITHUB_TOKEN: fixture
          NODE_OPTIONS: --import=${{ github.workspace }}/actions/changelog/tests/mock-github.mjs
      - name: Verify changelog outputs
        if: ${{ !inputs.skip-action-smoke-test }}
        env:
          OUTPUTS: ${{ toJSON(steps.notes.outputs) }}
        run: |
          jq -e '. == {
            "version":"1.2.3","branch":"changelogs/v1.2.3","pr-url":"https://example.test/pull/12",
            "pr-created":"false"
          }' <<< "$OUTPUTS"
      - name: Save verified Action bundle
        id: bundle
        if: inputs.upload-release-bundle && inputs.action == 'changelog'
        uses: actions/upload-artifact@v4
        with:
          name: verified-changelog-${{ github.run_attempt }}
          path: actions/changelog/dist/
          if-no-files-found: error

  changelog-cleanup:
    name: Changelog cleanup action
    if: ${{ inputs.action == '' || inputs.action == 'changelog-cleanup' }}
    runs-on: ubuntu-latest
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      bundle-source: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changelog cleanup action types
        run: pnpm --filter @release-bits/changelog-cleanup check
      - name: Build changelog cleanup action
        run: pnpm --filter @release-bits/changelog-cleanup build
      - name: Verify changelog cleanup action tests
        run: pnpm --filter @release-bits/changelog-cleanup test
      - name: Save verified Action bundle
        id: bundle
        if: inputs.upload-release-bundle && inputs.action == 'changelog-cleanup'
        uses: actions/upload-artifact@v4
        with:
          name: verified-changelog-cleanup-${{ github.run_attempt }}
          path: actions/changelog-cleanup/dist/
          if-no-files-found: error

  changelog-release:
    name: Changelog release action
    if: ${{ inputs.action == '' || inputs.action == 'changelog-release' }}
    runs-on: ubuntu-latest
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      bundle-source: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changelog release action types
        run: pnpm --filter @release-bits/changelog-release check
      - name: Build changelog release action
        run: pnpm --filter @release-bits/changelog-release build
      - name: Verify changelog release action tests
        run: pnpm --filter @release-bits/changelog-release test
      - name: Verify packaged changelog release action
        id: release
        if: ${{ !inputs.skip-action-smoke-test }}
        uses: ./actions/changelog-release
        with:
          version: 1.2.3
          catalog-path: actions/changelog-release/tests/fixtures/changelogs.json
          files: actions/changelog-release/tests/fixtures/asset.txt
        env:
          GITHUB_TOKEN: fixture
          NODE_OPTIONS: --import=${{ github.workspace }}/actions/changelog-release/tests/mock-github.mjs
      - name: Verify changelog release outputs
        if: ${{ !inputs.skip-action-smoke-test }}
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          jq -e '. == {
            "notes-en":"- Fixed the release fixture.",
            "tag-name":"v1.2.3",
            "release-url":"https://example.test/releases/v1.2.3"
          }' <<< "$OUTPUTS"
      - name: Save verified Action bundle
        id: bundle
        if: inputs.upload-release-bundle && inputs.action == 'changelog-release'
        uses: actions/upload-artifact@v4
        with:
          name: verified-changelog-release-${{ github.run_attempt }}
          path: actions/changelog-release/dist/
          if-no-files-found: error

  macos:
    name: macOS action
    if: ${{ inputs.action == '' || inputs.action == 'build-macos' }}
    runs-on: macos-latest
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      bundle-source: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check macOS action types
        run: pnpm --filter @release-bits/build-macos check
      - name: Build macOS action
        run: pnpm --filter @release-bits/build-macos build
      - name: Verify macOS builds and signing tools
        run: pnpm --filter @release-bits/build-macos test
      - name: Verify release script
        if: ${{ inputs.action == 'build-macos' }}
        run: node --test scripts/release.test.mjs
      - name: Save verified Action bundle
        id: bundle
        if: inputs.upload-release-bundle && inputs.action == 'build-macos'
        uses: actions/upload-artifact@v4
        with:
          name: verified-build-macos-${{ github.run_attempt }}
          path: actions/build-macos/dist/
          if-no-files-found: error
