name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Verify workspace and distributions
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          pnpm test
          test -z "$(git status --porcelain --untracked-files=all -- ':(glob)actions/*/dist/**')"
      - name: Exercise the packaged action
        id: notes
        uses: ./actions/changelog
        with:
          version: 1.2.3
        env:
          GITHUB_TOKEN: fixture
          NODE_OPTIONS: --import=${{ github.workspace }}/actions/changelog/test/mock-github.mjs
      - name: Verify runner outputs
        env:
          OUTPUTS: ${{ toJSON(steps.notes.outputs) }}
        run: |
          jq -e '. == {
            "version":"1.2.3","branch":"changelogs/v1.2.3","pr-url":"https://example.test/pull/12",
            "pr-created":"false","source-sha":"","commit-count":"0","warning-count":"0",
            "notes-json-path":"","notes-markdown-path":""
          }' <<< "$OUTPUTS"
