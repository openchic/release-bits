name: Test actions

on:
  push:
    branches: [main]
    paths:
      - 'actions/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'actions/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_call:
    inputs:
      skip-action-smoke-test:
        description: Skip the packaged Action smoke steps when the release workflow runs the verification suite.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Verify action workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          pnpm test
          test -z "$(git status --porcelain --untracked-files=all -- ':(glob)actions/*/dist/**')"
      - name: Verify packaged action
        id: notes
        if: ${{ !inputs.skip-action-smoke-test }}
        uses: ./actions/changelog
        with:
          version: 1.2.3
        env:
          GITHUB_TOKEN: fixture
          NODE_OPTIONS: --import=${{ github.workspace }}/actions/changelog/test/mock-github.mjs
      - name: Verify action outputs
        if: ${{ !inputs.skip-action-smoke-test }}
        env:
          OUTPUTS: ${{ toJSON(steps.notes.outputs) }}
        run: |
          jq -e '. == {
            "version":"1.2.3","branch":"changelogs/v1.2.3","pr-url":"https://example.test/pull/12",
            "pr-created":"false","source-sha":"","commit-count":"0","warning-count":"0",
            "notes-json-path":"","notes-markdown-path":""
          }' <<< "$OUTPUTS"
