name: Publish catalog release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Catalog version, for example 1.2.3
        required: true
        type: string
      tag_name:
        description: Existing tag pointing to the selected ref's commit, if supplied
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: openchic/release-bits/actions/changelog-release@v1
        with:
          version: ${{ inputs.version }}
          tag-name: ${{ inputs.tag_name }}
          # Download the original build artifacts before publishing with attachments.
          # files: |
          #   dist/App.dmg
          #   dist/App-intel.dmg
        env:
          GITHUB_TOKEN: ${{ github.token }}
