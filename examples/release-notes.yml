name: Prepare release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base version, for example 1.2.3
        required: true
      version_type:
        description: Leave none to use the version as-is
        type: choice
        options: [none, major, minor, patch]
        default: none
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: openchic/release-bits/actions/changelog@v1
        with:
          version: ${{ inputs.version }}
          version-type: ${{ inputs.version_type != 'none' && inputs.version_type || '' }}
          base-branch: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: openchic/release-bits/actions/changelog-cleanup@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
